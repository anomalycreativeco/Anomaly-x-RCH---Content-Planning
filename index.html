<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Anomaly × RCH — Monthly Content Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0a0a0a; --bg-2:#111111; --surface:#141414; --surface-2:#1a1a1a;
    --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
    --text:#f4f4f4; --muted:#8d8d8d; --faint:#5e5e5e;
    --accent:#98caea; --accent-dim:rgba(152,202,234,.16);
    --done:#5dcaa5; --done-tint:rgba(93,202,165,.13); --done-tint-2:rgba(93,202,165,.20);
    --serif:'Fraunces',Georgia,serif; --sans:'Hanken Grotesk',system-ui,sans-serif;
    --simple:'Helvetica Neue',Helvetica,Arial,sans-serif;
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; min-height:100vh; font-weight:400;
    background-image:radial-gradient(1100px 500px at 50% -10%, rgba(152,202,234,.07), transparent 70%);
  }
  a{color:var(--accent); text-decoration:none}

  /* Header */
  header{
    position:sticky; top:0; z-index:30;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:16px 28px; border-bottom:1px solid var(--line);
    background:rgba(10,10,10,.82); backdrop-filter:blur(12px);
  }
  .lockup{display:flex; align-items:center; gap:14px}
  .cross{color:var(--accent); font-size:16px; font-weight:300; opacity:.85}
  .anomaly-logo{height:34px; width:auto; mix-blend-mode:screen; display:block}
  .rch-logo{height:30px; width:auto; mix-blend-mode:screen; display:block}
  .head-right{display:flex; align-items:center; gap:18px}
  .tagline{font-size:10px; letter-spacing:.28em; text-transform:uppercase; color:var(--muted); font-weight:500}
  .status{display:flex; align-items:center; gap:7px; font-size:11px; color:var(--muted); letter-spacing:.04em}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--faint); box-shadow:0 0 0 0 rgba(0,0,0,0)}
  .dot.live{background:#5dcaa5; box-shadow:0 0 10px rgba(93,202,165,.6)}
  .dot.demo{background:#efb04f; box-shadow:0 0 10px rgba(239,176,79,.5)}

  /* Layout */
  main{max-width:1180px; margin:0 auto; padding:34px 28px 80px}

  .toolbar{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:26px}
  .month-nav{display:flex; align-items:center; gap:14px}
  .month-nav button.nav{
    width:38px; height:38px; border-radius:50%; border:1px solid var(--line-2);
    background:transparent; color:var(--text); font-size:18px; cursor:pointer; line-height:1;
    transition:.18s; display:flex; align-items:center; justify-content:center;
  }
  .month-nav button.nav:hover{background:var(--surface-2); border-color:var(--accent)}
  .month-label{font-family:var(--simple); font-weight:600; font-size:29px; letter-spacing:-.01em; min-width:248px; text-align:center}
  .month-label .yr{color:var(--muted); font-weight:400}

  .search{position:relative}
  .search input{
    width:300px; max-width:60vw; height:44px; padding:0 16px 0 42px;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    color:var(--text); font-family:var(--sans); font-size:14px; outline:none; transition:.18s;
  }
  .search input::placeholder{color:var(--faint)}
  .search input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim)}
  .search .ic{position:absolute; left:15px; top:50%; transform:translateY(-50%); color:var(--faint); font-size:16px; pointer-events:none}

  /* Table */
  .table-wrap{border:1px solid var(--line); border-radius:16px; overflow:hidden; background:var(--bg-2)}
  table{width:100%; border-collapse:collapse; table-layout:fixed}
  thead th{
    text-align:left; font-size:10.5px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--muted); font-weight:600; padding:15px 16px; background:var(--surface);
    border-bottom:1px solid var(--line);
  }
  col.c-check{width:54px} col.c-addr{width:21%} col.c-idea{width:30%}
  col.c-vid{width:17%} col.c-notes{width:auto} col.c-act{width:118px}
  tbody tr{border-bottom:1px solid var(--line); transition:background .15s, opacity .2s}
  tbody tr:last-child{border-bottom:none}
  tbody tr:hover{background:var(--surface)}
  td{padding:4px 8px; vertical-align:middle}
  td.check-cell{text-align:center; padding-left:14px}

  /* custom checkbox */
  .cbx{appearance:none; -webkit-appearance:none; width:20px; height:20px; border-radius:6px;
    border:1.5px solid var(--line-2); background:transparent; cursor:pointer; position:relative; transition:.16s; vertical-align:middle}
  .cbx:hover{border-color:var(--accent)}
  .cbx:checked{background:var(--done); border-color:var(--done)}
  .cbx:checked::after{content:''; position:absolute; left:6px; top:2px; width:5px; height:10px;
    border:solid #062a1e; border-width:0 2px 2px 0; transform:rotate(45deg)}

  .cell-input{
    width:100%; background:transparent; border:none; outline:none; color:var(--text);
    font-family:var(--sans); font-size:14px; line-height:1.5; padding:10px 8px; border-radius:8px;
    resize:none; overflow:hidden; transition:background .15s; font-weight:300;
  }
  .cell-input::placeholder{color:var(--faint); font-weight:300}
  .cell-input:focus{background:var(--surface-2); box-shadow:inset 0 -2px 0 var(--accent)}
  td.idea .cell-input{font-weight:400}

  .vid-cell{display:flex; align-items:center; gap:4px}
  .vid-cell .open{
    flex:none; width:30px; height:30px; border-radius:8px; border:1px solid var(--line);
    display:none; align-items:center; justify-content:center; color:var(--accent);
    background:var(--surface-2); cursor:pointer; font-size:14px; transition:.15s;
  }
  .vid-cell .open:hover{border-color:var(--accent)}
  .vid-cell.has-link .open{display:flex}

  /* row actions: duplicate / reschedule / delete */
  .row-actions{display:flex; gap:5px; justify-content:flex-end; align-items:center; opacity:0; transition:opacity .15s}
  tr:hover .row-actions{opacity:1}
  .act-btn{
    width:30px; height:30px; border-radius:8px; border:1px solid transparent; background:transparent;
    color:var(--faint); cursor:pointer; transition:.15s; display:flex; align-items:center; justify-content:center; flex:none;
  }
  .act-btn svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
  .act-btn.dup:hover,.act-btn.mv:hover{color:var(--accent); border-color:rgba(152,202,234,.35); background:var(--accent-dim)}
  .act-btn.del:hover{color:#e8857f; border-color:rgba(232,133,127,.35); background:rgba(232,133,127,.08)}

  /* done state — green tint (matches the green-row convention) */
  tr.done{background:var(--done-tint); box-shadow:inset 3px 0 0 var(--done)}
  tr.done:hover{background:var(--done-tint-2)}
  tr.done .cell-input{color:#bfe8d8}
  tr.done .cell-input::placeholder{color:rgba(191,232,216,.4)}

  /* add row */
  .add-row{
    width:100%; margin-top:14px; height:50px; border:1px dashed var(--line-2); border-radius:14px;
    background:transparent; color:var(--muted); font-family:var(--sans); font-size:13.5px;
    letter-spacing:.06em; cursor:pointer; transition:.18s; display:flex; align-items:center; justify-content:center; gap:9px;
  }
  .add-row:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-dim)}
  .add-row .plus{font-size:18px; line-height:1}

  .empty-note{padding:46px 16px; text-align:center; color:var(--faint); font-size:13px}

  footer{margin-top:46px; text-align:center; color:var(--faint); font-size:11px; letter-spacing:.12em}
  footer b{color:var(--muted); font-weight:500}

  /* reschedule modal */
  .modal-overlay{position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.6); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center; padding:20px}
  .modal-overlay[hidden]{display:none}
  .modal{background:var(--bg-2); border:1px solid var(--line-2); border-radius:18px; width:min(380px,100%);
    padding:26px 24px; box-shadow:0 30px 80px rgba(0,0,0,.55)}
  .modal h3{margin:0 0 4px; font-family:var(--serif); font-weight:500; font-size:22px; letter-spacing:.01em}
  .modal .sub{margin:0 0 20px; color:var(--muted); font-size:13px; line-height:1.5}
  .modal .sub b{color:var(--text); font-weight:500}
  .modal-month{display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:22px}
  .modal-month button{width:40px; height:40px; border-radius:9px; border:1px solid var(--line-2); background:transparent;
    color:var(--text); font-size:19px; cursor:pointer; transition:.15s}
  .modal-month button:hover{border-color:var(--accent); background:var(--surface-2)}
  .modal-month .mlabel{font-family:var(--simple); font-weight:600; font-size:18px; text-align:center; flex:1}
  .modal-month .mlabel .yr{color:var(--muted)}
  .modal-actions{display:flex; gap:10px}
  .btn{flex:1; height:46px; border-radius:11px; font-family:var(--sans); font-size:14px; letter-spacing:.04em;
    cursor:pointer; transition:.15s; border:1px solid var(--line-2); font-weight:500}
  .btn-ghost{background:transparent; color:var(--muted)}
  .btn-ghost:hover{color:var(--text); border-color:var(--line-2)}
  .btn-go{background:var(--accent); color:#06243a; border-color:var(--accent)}
  .btn-go:hover{filter:brightness(1.08)}
  .btn-go:disabled{opacity:.4; cursor:not-allowed; filter:none}

  /* toast */
  .toast{position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px); z-index:70;
    background:var(--surface-2); border:1px solid var(--line-2); color:var(--text); font-size:13px;
    padding:12px 18px; border-radius:12px; box-shadow:0 16px 40px rgba(0,0,0,.5); opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s; display:flex; align-items:center; gap:9px}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .toast .tdot{width:8px; height:8px; border-radius:50%; background:var(--done)}

  .ti{font-family:'tabler-icons'}

  /* ---------------- MOBILE: table → stacked cards ---------------- */
  @media (max-width:720px){
    header{padding:12px 14px}
    .tagline{display:none}
    .anomaly-logo{height:26px}
    .rch-logo{height:23px}
    .lockup{gap:10px}
    .status{font-size:10px}

    main{padding:18px 12px 64px}

    /* toolbar stacks; search goes full width */
    .toolbar{flex-direction:column; align-items:stretch; gap:16px; margin-bottom:20px}
    .month-nav{justify-content:center}
    .month-nav button.nav{width:44px; height:44px; font-size:20px}
    .month-label{font-size:27px; min-width:auto}
    .search input{width:100%; max-width:none; height:48px; font-size:16px}

    /* dismantle the table grid */
    .table-wrap{border:none; background:transparent; overflow:visible; border-radius:0}
    table,thead,tbody,tr,td{display:block; width:auto}
    colgroup,thead{display:none}

    /* each row becomes a card */
    tbody tr{
      position:relative; background:var(--bg-2);
      border:1px solid var(--line); border-radius:16px;
      margin-bottom:14px; padding:0 0 10px; overflow:hidden;
    }
    tbody tr:hover{background:var(--bg-2)}

    /* checkbox cell → top bar */
    td.check-cell{
      display:flex; align-items:center; gap:12px; text-align:left;
      padding:14px 16px; border-bottom:1px solid var(--line); background:var(--surface);
    }
    td.check-cell::after{
      content:'Mark complete'; font-size:11px; letter-spacing:.16em;
      text-transform:uppercase; color:var(--muted); font-weight:600;
    }
    .cbx{width:26px; height:26px; border-radius:7px}
    .cbx:checked::after{left:8px; top:3px; width:6px; height:12px}

    /* content cells with field labels */
    td.addr,td.idea,td.vid,td.notes{padding:13px 16px 5px}
    td.addr::before,td.idea::before,td.vid::before,td.notes::before{
      content:attr(data-label); display:block;
      font-size:10px; letter-spacing:.16em; text-transform:uppercase;
      color:var(--muted); font-weight:600; margin-bottom:3px;
    }
    .cell-input{font-size:16px; padding:6px 0; line-height:1.45}
    .cell-input:focus{background:transparent; box-shadow:inset 0 -2px 0 var(--accent)}
    .vid-cell .open{display:none; width:38px; height:38px}
    .vid-cell.has-link .open{display:flex}

    /* delete/actions → persistent top-right group (no hover on touch) */
    td.act-cell{position:absolute; top:9px; right:10px; padding:0}
    .row-actions{opacity:1; gap:7px}
    .act-btn{width:36px; height:36px; border-color:var(--line); background:var(--surface-2)}
    .act-btn svg{width:17px; height:17px}

    /* green completion on cards */
    tr.done td.check-cell{background:var(--done-tint-2); border-bottom-color:rgba(93,202,165,.3)}
    tr.done{border-color:rgba(93,202,165,.4); box-shadow:none}
    tr.done td.check-cell::after{color:#bfe8d8}

    .add-row{height:54px; font-size:14px}
    footer{font-size:10px}
  }

  @media (max-width:380px){
    #statusText{display:none}            /* keep just the status dot on tiny screens */
    .anomaly-logo{height:23px}
    .rch-logo{height:20px}
    .month-label{font-size:24px}
    .act-btn{width:34px; height:34px}
  }
</style>
</head>

<script type="module">
/* ============================================================
   DATA LAYER
   Uses Firestore when firebase-config.js is filled in.
   Falls back to an in-memory DEMO store otherwise, so the page
   is fully usable the moment you open it.
============================================================ */

let store;        // active store implementation
let mode = 'demo';

async function initStore(){
  let cfg = null;
  try {
    const m = await import('./firebase-config.js');
    cfg = m.firebaseConfig;
  } catch(e){ cfg = null; }

  const configured = cfg && cfg.apiKey && !String(cfg.apiKey).includes('PASTE_YOUR');

  if (configured){
    try {
      const appMod = await import('https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js');
      const fs = await import('https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js');
      const app = appMod.initializeApp(cfg);
      const db = fs.getFirestore(app);
      store = makeFirestoreStore(fs, db);
      mode = 'live';
      return;
    } catch(e){
      console.error('Firebase init failed, using demo mode:', e);
    }
  }
  store = makeDemoStore();
  mode = 'demo';
}

/* ---- Firestore store ---- */
function makeFirestoreStore(fs, db){
  const { collection, doc, onSnapshot, query, orderBy, addDoc, updateDoc, deleteDoc, serverTimestamp } = fs;
  const rowsCol = (monthKey)=> collection(db, 'months', monthKey, 'rows');
  return {
    subscribe(monthKey, cb){
      const q = query(rowsCol(monthKey), orderBy('order'));
      return onSnapshot(q, (snap)=>{
        const rows = snap.docs.map(d=>({ id:d.id, ...d.data() }));
        cb(rows);
      }, (err)=> console.error('snapshot error', err));
    },
    addRow(monthKey, data){ return addDoc(rowsCol(monthKey), { ...data, createdAt:serverTimestamp() }); },
    updateRow(monthKey, id, patch){ return updateDoc(doc(db,'months',monthKey,'rows',id), patch); },
    deleteRow(monthKey, id){ return deleteDoc(doc(db,'months',monthKey,'rows',id)); }
  };
}

/* ---- Demo store (in-memory, with a little seed data) ---- */
function makeDemoStore(){
  const data = {};      // monthKey -> [rows]
  const subs = {};      // monthKey -> Set(cb)
  let seq = 1;
  const nid = ()=> 'demo-'+(seq++);

  // seed the current month with a couple of example rows
  const now = new Date();
  const seedKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  data[seedKey] = [
    { id:nid(), order:0, done:false, address:'2108 Ridge Road (Coming Soon)', idea:'Designer vs. Contractor', video:'', notes:'Sketch-to-reality angle' },
    { id:nid(), order:1, done:false, address:'1208 Barcroft', idea:'Construction reel — b-roll', video:'https://www.instagram.com/reel/DUEziMKEqnD/', notes:'Kyle to talk through framing' },
    { id:nid(), order:2, done:true,  address:'Wellington', idea:'“We sold the first house”', video:'', notes:'Tease breaking ground on lot 2' },
  ];

  const emit = (k)=>{ (subs[k]||new Set()).forEach(cb=> cb(clone(data[k]||[]).sort((a,b)=>a.order-b.order))); };
  const clone = (x)=> JSON.parse(JSON.stringify(x));

  return {
    subscribe(monthKey, cb){
      (subs[monthKey] ||= new Set()).add(cb);
      cb(clone(data[monthKey]||[]).sort((a,b)=>a.order-b.order));
      return ()=> subs[monthKey].delete(cb);
    },
    addRow(monthKey, d){ (data[monthKey] ||= []).push({ id:nid(), ...d }); emit(monthKey); return Promise.resolve(); },
    updateRow(monthKey, id, patch){
      const arr = data[monthKey]||[]; const r = arr.find(x=>x.id===id);
      if(r) Object.assign(r, patch); emit(monthKey); return Promise.resolve();
    },
    deleteRow(monthKey, id){
      data[monthKey] = (data[monthKey]||[]).filter(x=>x.id!==id); emit(monthKey); return Promise.resolve();
    }
  };
}

/* ============================================================
   APP
============================================================ */
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const IC = {
  dup:  '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
  cal:  '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/><path d="M12.5 13l2.5 2.5-2.5 2.5"/></svg>',
  trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"/></svg>'
};
const keyOf = (d)=> `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
const $ = (s)=> document.querySelector(s);
const rowsEl = $('#rows');

let view = new Date();           // currently displayed month
let current = [];                // latest rows snapshot for the month
let unsub = null;
let writeTimers = {};            // debounce timers per cell
let creatingBlank = false;       // guard against double blank-row creation

const monthKey = ()=> `${view.getFullYear()}-${String(view.getMonth()+1).padStart(2,'0')}`;

function setStatus(){
  const dot = $('#dot'), txt = $('#statusText');
  if(mode==='live'){ dot.className='dot live'; txt.textContent='Live · synced'; }
  else { dot.className='dot demo'; txt.textContent='Local demo'; }
}

function renderMonthLabel(){
  $('#monthName').textContent = MONTHS[view.getMonth()];
  $('#monthYear').textContent = view.getFullYear();
}

function subscribeMonth(){
  if(unsub) unsub();
  current = [];
  rowsEl.innerHTML = `<tr><td colspan="6" class="empty-note">Loading…</td></tr>`;
  unsub = store.subscribe(monthKey(), (rows)=>{
    current = rows;
    if(rows.length===0 && !creatingBlank){
      creatingBlank = true;
      store.addRow(monthKey(), blankRow(0)).finally(()=>{ creatingBlank=false; });
      return; // snapshot will fire again with the new row
    }
    render();
  });
}

const blankRow = (order)=> ({ order, done:false, address:'', idea:'', video:'', notes:'' });

function captureFocus(){
  const el = document.activeElement;
  if(el && el.classList && el.classList.contains('cell-input')){
    return { id: el.dataset.id, field: el.dataset.field, value: el.value,
             s: el.selectionStart, e: el.selectionEnd };
  }
  return null;
}
function restoreFocus(f){
  if(!f) return;
  const el = rowsEl.querySelector(`.cell-input[data-id="${f.id}"][data-field="${f.field}"]`);
  if(el){ el.focus(); try{ el.setSelectionRange(f.s, f.e); }catch(_){} }
}

function render(){
  const focus = captureFocus();
  const q = $('#search').value.trim().toLowerCase();
  rowsEl.innerHTML = '';

  current.slice().sort((a,b)=>a.order-b.order).forEach(r=>{
    const tr = document.createElement('tr');
    tr.dataset.id = r.id;
    if(r.done) tr.classList.add('done');

    // search filter
    const hay = `${r.address||''} ${r.idea||''} ${r.notes||''} ${r.video||''}`.toLowerCase();
    if(q && !hay.includes(q)) tr.style.display='none';

    tr.innerHTML = `
      <td class="check-cell"><input type="checkbox" class="cbx" ${r.done?'checked':''} data-id="${r.id}" data-field="done" aria-label="Mark complete"></td>
      <td class="addr" data-label="Address / Topic">${input(r,'address','Address or topic')}</td>
      <td class="idea" data-label="Idea">${input(r,'idea','Content idea')}</td>
      <td class="vid" data-label="Inspiration video"><div class="vid-cell ${isUrl(r.video)?'has-link':''}">${input(r,'video','Paste link (optional)')}<button class="open" data-open="${r.id}" title="Open video" aria-label="Open video">↗</button></div></td>
      <td class="notes" data-label="Notes">${input(r,'notes','Notes (optional)')}</td>
      <td class="act-cell"><div class="row-actions">
        <button class="act-btn dup" data-dup="${r.id}" title="Duplicate row" aria-label="Duplicate row">${IC.dup}</button>
        <button class="act-btn mv" data-move="${r.id}" title="Move to another month" aria-label="Move to another month">${IC.cal}</button>
        <button class="act-btn del" data-del="${r.id}" title="Delete row" aria-label="Delete row">${IC.trash}</button>
      </div></td>`;
    rowsEl.appendChild(tr);
  });

  // re-inject the value the user is actively typing (avoid clobber)
  if(focus){
    const live = rowsEl.querySelector(`.cell-input[data-id="${focus.id}"][data-field="${focus.field}"]`);
    if(live) live.value = focus.value;
  }
  autosizeAll();
  restoreFocus(focus);
}

function input(r, field, ph){
  const v = (r[field]||'').replace(/"/g,'&quot;');
  return `<textarea rows="1" class="cell-input" data-id="${r.id}" data-field="${field}" placeholder="${ph}">${escapeHtml(r[field]||'')}</textarea>`;
}
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function isUrl(s){ return /^https?:\/\//i.test((s||'').trim()); }

function autosize(el){ el.style.height='auto'; el.style.height = Math.max(el.scrollHeight, 22) + 'px'; }
function autosizeAll(){ rowsEl.querySelectorAll('.cell-input').forEach(autosize); }

/* events (delegated) */
rowsEl.addEventListener('input', (e)=>{
  const el = e.target;
  if(el.classList.contains('cell-input')){
    autosize(el);
    const {id, field} = el.dataset;
    // live-toggle the open button for video field
    if(field==='video'){
      const wrap = el.closest('.vid-cell');
      wrap.classList.toggle('has-link', isUrl(el.value));
    }
    const key = id+'|'+field, val = el.value;
    clearTimeout(writeTimers[key]);
    writeTimers[key] = setTimeout(()=> store.updateRow(monthKey(), id, { [field]: val }), 450);
  }
});
rowsEl.addEventListener('change', (e)=>{
  if(e.target.classList.contains('cbx')){
    store.updateRow(monthKey(), e.target.dataset.id, { done: e.target.checked });
  }
});
rowsEl.addEventListener('click', (e)=>{
  // tapping anywhere on the checkbox bar toggles complete (bigger mobile target)
  const cc = e.target.closest('td.check-cell');
  if(cc && !e.target.classList.contains('cbx')){
    const box = cc.querySelector('.cbx');
    box.checked = !box.checked;
    store.updateRow(monthKey(), box.dataset.id, { done: box.checked });
    return;
  }
  const del = e.target.closest('[data-del]');
  if(del){
    const id = del.dataset.del;
    if(current.length<=1){ // keep at least one row; just clear it
      store.updateRow(monthKey(), id, blankRow(0));
    } else {
      store.deleteRow(monthKey(), id);
    }
    return;
  }
  const open = e.target.closest('[data-open]');
  if(open){
    const r = current.find(x=>x.id===open.dataset.open);
    if(r && isUrl(r.video)) window.open(r.video.trim(), '_blank', 'noopener');
    return;
  }
  const dup = e.target.closest('[data-dup]');
  if(dup){ duplicateRow(dup.dataset.dup); return; }
  const mv = e.target.closest('[data-move]');
  if(mv){ openMoveModal(mv.dataset.move); return; }
});

/* duplicate a row, inserting the copy directly beneath the original */
function duplicateRow(id){
  const sorted = current.slice().sort((a,b)=>a.order-b.order);
  const i = sorted.findIndex(r=>r.id===id);
  if(i<0) return;
  const r = sorted[i], next = sorted[i+1];
  const newOrder = next ? (r.order+next.order)/2 : r.order+1;
  store.addRow(monthKey(), { order:newOrder, done:false,
    address:r.address||'', idea:r.idea||'', video:r.video||'', notes:r.notes||'' });
  toast('Row duplicated');
}

/* ---- reschedule (move to another month) ---- */
let moveState = { id:null, date:null };

function openMoveModal(id){
  const r = current.find(x=>x.id===id);
  if(!r) return;
  moveState.id = id;
  moveState.date = new Date(view.getFullYear(), view.getMonth()+1, 1); // default: next month
  $('#moveName').textContent = (r.idea || r.address || 'this card').slice(0,40) || 'this card';
  renderMoveLabel();
  $('#moveModal').hidden = false;
}
function renderMoveLabel(){
  $('#mMonth').textContent = MONTHS[moveState.date.getMonth()];
  $('#mYear').textContent = moveState.date.getFullYear();
  const same = keyOf(moveState.date) === monthKey();
  const btn = $('#mConfirm');
  btn.disabled = same;
  btn.textContent = same ? 'Same month' : 'Move card';
}
function closeMoveModal(){ $('#moveModal').hidden = true; moveState.id = null; }

async function moveRow(){
  const id = moveState.id, target = keyOf(moveState.date);
  if(!id || target===monthKey()) return;
  const r = current.find(x=>x.id===id);
  if(!r) return closeMoveModal();
  const label = `${MONTHS[moveState.date.getMonth()]} ${moveState.date.getFullYear()}`;
  closeMoveModal();
  await store.addRow(target, { order:Date.now(), done:!!r.done,
    address:r.address||'', idea:r.idea||'', video:r.video||'', notes:r.notes||'' });
  await store.deleteRow(monthKey(), id);
  toast('Moved to '+label);
}

$('#mPrev').addEventListener('click', ()=>{ moveState.date.setMonth(moveState.date.getMonth()-1); renderMoveLabel(); });
$('#mNext').addEventListener('click', ()=>{ moveState.date.setMonth(moveState.date.getMonth()+1); renderMoveLabel(); });
$('#mCancel').addEventListener('click', closeMoveModal);
$('#mConfirm').addEventListener('click', moveRow);
$('#moveModal').addEventListener('click', (e)=>{ if(e.target.id==='moveModal') closeMoveModal(); });
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape' && !$('#moveModal').hidden) closeMoveModal(); });

/* ---- toast ---- */
let toastTimer;
function toast(msg){
  $('#toastMsg').textContent = msg;
  const t = $('#toast'); t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2600);
}

$('#addRow').addEventListener('click', ()=>{
  const nextOrder = current.length ? Math.max(...current.map(r=>r.order))+1 : 0;
  store.addRow(monthKey(), blankRow(nextOrder)).then(()=>{
    // focus the new row's first cell shortly after it renders
    setTimeout(()=>{
      const last = rowsEl.querySelector('tr:last-child .cell-input[data-field="address"]');
      if(last) last.focus();
    }, 120);
  });
});

$('#search').addEventListener('input', render);
$('#prevMonth').addEventListener('click', ()=>{ view.setMonth(view.getMonth()-1); renderMonthLabel(); subscribeMonth(); });
$('#nextMonth').addEventListener('click', ()=>{ view.setMonth(view.getMonth()+1); renderMonthLabel(); subscribeMonth(); });

/* boot */
(async ()=>{
  await initStore();
  setStatus();
  renderMonthLabel();
  subscribeMonth();
})();
</script>
</body>
</html>
